name: CI

# Fresh-clone build and selected software emulator checks.
#
# Proprietary Cubism is excluded. The separate product-emulator job validates only software;
# physical-device, hardware audio and cloud evidence remain separate.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  product-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_AVD_HOME: ${{ runner.temp }}/banxuan-avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build product test APKs (no proprietary SDK)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Provision official Android API 28 emulator
        run: |
          set -euo pipefail
          mkdir -p build/emulator-evidence
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'platform-tools' 'system-images;android-28;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name banxuan-ci --package 'system-images;android-28;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd banxuan-ci -port 5554 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -memory 2048 > build/emulator-evidence/emulator.log 2>&1 &
          echo "$!" > build/emulator-evidence/emulator.pid
          timeout 300 bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do kill -0 "$(cat build/emulator-evidence/emulator.pid)" || { cat build/emulator-evidence/emulator.log; exit 1; }; sleep 2; done'
          adb -s emulator-5554 shell wm size 410x502
          adb -s emulator-5554 shell wm density 320
          adb -s emulator-5554 shell settings put system font_scale 1.0
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 shell getprop ro.build.version.sdk > build/emulator-evidence/api.txt
          adb -s emulator-5554 shell getprop ro.product.cpu.abilist > build/emulator-evidence/abi.txt
          adb -s emulator-5554 shell wm size > build/emulator-evidence/window.txt
          adb -s emulator-5554 shell wm density >> build/emulator-evidence/window.txt
      - name: Install product APKs
        run: |
          adb -s emulator-5554 install -r app/build/outputs/apk/debug/app-debug.apk
          adb -s emulator-5554 install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Whole-run product gate — SOFTWARE EMULATOR
        shell: pwsh
        run: ./evidence/tests/run_product_suite.ps1 -Serial emulator-5554 -Log build/emulator-evidence/product-suite.log
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p build/emulator-evidence
          adb -s emulator-5554 logcat -d > build/emulator-evidence/logcat.txt 2>&1 || true
          adb -s emulator-5554 emu kill || true
      - name: Upload software emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-emulator-${{ github.sha }}
          path: build/emulator-evidence/
          if-no-files-found: error
          retention-days: 14

  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Repository hygiene
        run: |
          set -eu
          if [ -n "$(git ls-files third_party/live2d)" ]; then
            echo "::error::proprietary Live2D files are tracked:"
            git ls-files third_party/live2d
            exit 1
          fi
          # The character directory deliberately keeps a tracked .gitignore: it commits the directory
          # while ignoring its contents, so only other tracked files count as a violation. Without the
          # filter this guard fires on its own placeholder, which is how the first CI run failed.
          assets="$(git ls-files app/src/main/assets/character | grep -v '/\.gitignore$' || true)"
          if [ -n "$assets" ]; then
            echo "::error::customer character assets are tracked:"
            printf '%s\n' "$assets"
            exit 1
          fi
          echo "repo hygiene: no proprietary or customer assets tracked"

      - name: Assert :core-live2d is absent without the SDK
        run: |
          set -eu
          if grep -q 'core-live2d' settings.gradle.kts && \
             [ -d third_party/live2d/sdk-r5/CubismSdkForJava-5-r.5 ]; then
            echo "::error::SDK present in CI image; this job assumes it is absent"
            exit 1
          fi
          echo "no Cubism SDK in the checkout, as expected"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: JVM tests
        run: |
          ./gradlew :core-protocol:test :core-audio:test :core-memory:test :core-memory-remote:test --console=plain
          # The composition layer is pure logic over two interfaces, so it runs here rather than only on
          # an emulator. What it enforces is ordering - remote first, cache second, nothing written when
          # the authority refuses - which is worth checking on every change.
          ./gradlew :app:testDebugUnitTest --console=plain

      # The shared canonical-memory contract is enforced on both sides, and both sides run in
      # this gate: the Kotlin conformance runner is inside :core-memory:test above, and the
      # Python conformance script below. Only the language-neutral contract runs here.
      #
      # The Xiaozhi integration evidence deliberately does NOT run here. It needs the frozen
      # xiaozhi-server checkout, and making this repository's gate depend on a second public
      # repository being reachable is a worse trade than leaving that evidence local.
      # No pip install: the conformance script is standard library only.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python canonical memory conformance
        run: |
          python evidence/tests/test_canonical_memory_conformance.py
          python evidence/tests/test_memory_http_boundary.py
          python evidence/tests/test_memory_http_handler.py
          python evidence/tests/test_preview_payload.py

      - name: Assemble app
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain

      # The cache module is compiled here, and that is all this job claims about it. Its behaviour needs
      # a real SQLite, so it is verified on an emulator instead; a runner without one cannot honestly
      # assert anything about Room at runtime.
      - name: Assemble the Room cache module
        run: |
          ./gradlew :core-memory-cache-android:assembleDebug \
                    :core-memory-cache-android:assembleDebugAndroidTest --console=plain

      # No signing secrets are exposed to PRs. These are explicitly debug previews.
      # Only a fully successful job reaches the upload step.
      - name: Inspect and prepare Preview APK
        run: |
          python scripts/prepare_preview.py --apk app/build/outputs/apk/debug/app-debug.apk \
            --out build/preview --commit "$GITHUB_SHA" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0"

      - name: Upload Banxuan Debug Preview
        uses: actions/upload-artifact@v4
        with:
          name: banxuan-preview-${{ github.sha }}
          path: build/preview/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
